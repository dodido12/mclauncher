# Archivo cross de Meson para compilar Mesa (Zink) con el NDK. Ajusta NDK_BIN.
[constants]
NDK_BIN = '/opt/android/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
c = NDK_BIN / 'aarch64-linux-android29-clang'
cpp = NDK_BIN / 'aarch64-linux-android29-clang++'
ar = NDK_BIN / 'llvm-ar'
strip = NDK_BIN / 'llvm-strip'
pkg-config = 'pkg-config'
# sin CMake: evita que Meson encuentre paquetes del host (SPIRV-Tools, etc.)
cmake = 'false'

[built-in options]
c_args = ['-I/home/claude/mclauncher/natives/mesa/stubs', '-O2', '-fPIC', '-Wno-error', '-D__STDC_FORMAT_MACROS']
cpp_args = ['-I/home/claude/mclauncher/natives/mesa/stubs', '-O2', '-fPIC', '-Wno-error']
c_link_args = ['-llog', '-lsync', '-static-libstdc++', '-Wl,-z,max-page-size=16384']
cpp_link_args = ['-llog', '-lsync', '-static-libstdc++', '-Wl,-z,max-page-size=16384']

[host_machine]
# 'linux' (no 'android') para no depender de libcutils/libsync/libhardware, que no son
# librerías públicas del NDK. El compilador sigue definiendo __ANDROID__ (bionic, libvulkan.so).
system = 'linux'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
