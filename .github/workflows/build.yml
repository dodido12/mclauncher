name: Compilar APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # jre_lwjgl3glfw compila con toolchain Java 8; Gradle corre con 17
          java-version: |
            8
            17

      # El runner ya trae el Android SDK en $ANDROID_HOME; faltan los paquetes que usa ZalithLauncher.
      - name: Instalar SDK 34, build-tools 34 y NDK r25c
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - uses: gradle/actions/setup-gradle@v4

      # Igual que el workflow de ZalithLauncher: primero el GLFW en Java (lwjgl-glfw-classes.jar)
      - name: Compilar jre_lwjgl3glfw
        run: |
          chmod +x gradlew
          ./gradlew jre_lwjgl3glfw:build --no-daemon

      - name: Compilar ZalithLauncher (debug, arm64)
        run: ./gradlew ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zalith-hdr-debug-apk
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
